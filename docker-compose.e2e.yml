# E2E テスト専用の PostgreSQL + MinIO (開発用の docker-compose.yml とポート・データを分離)
# データは tmpfs (メモリ上) に置くため、コンテナを作り直すたびに空の状態から始まる
# 起動・停止は e2e/server.mjs と Playwright の globalTeardown が行う (`npm run test:e2e`)
name: salon-e2e

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_story_e2e
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_story_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
    tmpfs:
      - /data
