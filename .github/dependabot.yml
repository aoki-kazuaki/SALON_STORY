# Dependabot: 依存ライブラリ・GitHub Actions の更新 PR を毎週自動で作成する
# - 更新 PR は開発ブランチ (develop) 宛てに作成し、main へは develop からのリリース PR で反映する
# - 作成された PR にも CI / Security ワークフローが走るため、テスト・脆弱性チェックに通ったものだけマージする
# - 既知の脆弱性に対する緊急の更新 PR は、リポジトリ設定の「Dependabot security updates」で随時作成される
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # 公開直後のバージョンは取り込まない (乗っ取られたパッケージの悪意ある版を掴むリスクを下げる)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # 提案しない更新 (解除するときは docs/development/ci-operations.md の「除外ルール」を参照)
    ignore:
      # TypeScript 7 (ネイティブ実装への全面刷新) は typescript-eslint が未対応で ESLint が動かないため、
      # メジャー更新は周辺ツールの対応を確認してから手動で行う (マイナー・パッチ更新は引き続き提案される)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 型定義は実行環境の Node.js (24) に合わせる。新しいメジャーの型を入れると、Node 24 に無い機能を使えてしまう
      # Node.js 本体を上げるときに、CI (ci.yml / security.yml の node-version) と一緒に手動で上げる
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
    # 一緒に更新しないと動かないものはまとめる (上から順に最初に一致したグループに入る)
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@testing-library/*", "jsdom"]
      # 上記以外のマイナー・パッチ更新は1つの PR にまとめる (メジャー更新は破壊的変更があり得るため個別の PR)
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns: ["*"]
