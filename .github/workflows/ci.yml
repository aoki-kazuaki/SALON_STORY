name: CI

# main / develop への PR とマージ後に、品質チェック (Lint・型・テスト・ビルド・ライセンス) を行う
# 脆弱性チェックは security.yml で行う
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# 同じ PR に新しいコミットが push されたら、古いコミット向けの実行をキャンセルする (結果は最新のコミットのものだけが使われるため)
# main / develop への push と定期実行はキャンセルせず、コミットごとの結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # ビルド時にモジュールを読み込むためのダミー値 (DB・S3 には接続しない)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-dummy-secret-ci-dummy-secret-0000
      BETTER_AUTH_URL: http://localhost:3000
      S3_BUCKET: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      # 単体テストの実行と、カバレッジ 90% 未満での失敗 (基準は vitest.config.mts の coverage.thresholds)
      - name: Vitest (カバレッジ 90% 以上)
        run: npm run test:coverage

      # どの行がテストされていないかを確認できるよう、カバレッジの HTML レポートを成果物として保存する (失敗時も保存)
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: License check (ソースコード公開などの義務を伴うライセンスの検出)
        run: npm run license:check
