name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # ビルド時にモジュールを読み込むためのダミー値 (DB・S3 には接続しない)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-dummy-secret-ci-dummy-secret-0000
      BETTER_AUTH_URL: http://localhost:3000
      S3_BUCKET: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

      - name: License check (商用利用不可ライセンスの検出)
        run: npm run license:check
