services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_story
    ports:
      - "5433:5432" # ホストに既存の PostgreSQL がある場合の衝突回避のため 5433 で公開
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_story"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Docker Hub の minio/minio は配布終了のため、Chainguard 配布の MinIO イメージを利用
  # バケットはアプリ側 (src/lib/s3.ts) で初回アクセス時に自動作成する
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
